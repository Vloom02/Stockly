<!-- Supabase → Authentication → Emails → "Reset password". Asunto: Tu código para Stockly -->

  <h2 style="font-size: 22px;">Recuperar tu contraseña</h2>
  <p style="font-size: 17px;">Escribí este código en la app Stockly:</p>
  <p style="font-size: 36px; font-weight: bold; letter-spacing: 8px; background: #f4f1ea; padding: 16px; text-align: center; border-radius: 12px;">{{ .Token }}</p>
  <p style="font-size: 15px; color: #555;">Vence en 1 hora. Si no pediste cambiar la contraseña, ignorá este email.</p>
</div>
